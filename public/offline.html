<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Matomari — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        color: #000;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #000;
          color: #fff;
        }
      }
      main {
        width: min(100%, 22rem);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #737373;
      }
      button {
        margin-top: 1.25rem;
        border: none;
        border-radius: 9999px;
        background: #000;
        color: #fff;
        padding: 0.75rem 1.25rem;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #fff;
          color: #000;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You&apos;re offline</h1>
      <p>
        Matomari could not reach the server. If you have studied here before, open the app once
        while online so it can save for offline use.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
